name: Scan sécurité conteneur

# Déclencheurs : à chaque push sur main et à chaque pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  trivy:
    name: Scan d'image conteneur (Trivy)
    runs-on: ubuntu-24.04
    steps:
      # 1. Récupère le code du dépôt.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Construit l'image à partir du Dockerfile.
      - name: Build de l'image Docker
        run: docker build -t secure-api:${{ github.sha }} .

      # 3. Scanne l'image et FAIT ÉCHOUER le job si une CVE HIGH/CRITICAL
      #    corrigeable est présente (exit-code: 1).
      - name: Scan Trivy (HIGH, CRITICAL → bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'secure-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'           # 1 = casse la CI si des CVE sont trouvées
          ignore-unfixed: true     # on n'échoue que sur ce qui a un correctif
          vuln-type: 'os,library'  # paquets OS + dépendances (composer.lock)
          severity: 'CRITICAL,HIGH'
        # Astuce : tant que l'image de départ est vulnérable, ce step est ROUGE.
        # Une fois le Dockerfile et les dépendances corrigés, il passe au VERT.
