# nginx sert le HTTP et délègue l'exécution PHP à PHP-FPM (service "app").
# nginx vient de l'image officielle : ce N'EST PAS l'image que vous scannez/corrigez.
# L'image cible du lab est celle que VOUS construisez (le service "app" / vulnerable-api).

server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
    }
}
